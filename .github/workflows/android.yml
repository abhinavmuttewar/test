name: Build APK

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Download offline wake-word model
        run: |
          curl -sSL -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q model.zip
          mkdir -p app/src/main/assets
          mv vosk-model-small-en-us-0.15 app/src/main/assets/model-en-us
          echo "vosk-model-small-en-us-0.15" > app/src/main/assets/model-en-us/uuid

      - name: Unit tests and APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: VoicePilot-apk
          path: app/build/outputs/apk/debug/app-debug.apk
